<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ONEX Consultant - Your Gateway to Intelligent AI & Digital Transformation Solutions">
  <title>Login | ONEX Consultant</title>
  
  <!-- Design System & Components -->
  <link rel="stylesheet" href="styles/design-system.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    /* Page-specific styles */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-50) 0%, var(--gray-100) 50%, var(--accent-cyan-light) 100%);
      position: relative;
      overflow: hidden;
    }

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(15, 98, 254, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveBackground 20s linear infinite;
      z-index: 0;
    }

    @keyframes moveBackground {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: var(--space-4);
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: var(--space-10) var(--space-8);
      box-shadow: var(--shadow-2xl);
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    .logo-wrapper {
      margin-bottom: var(--space-6);
      animation: float 3s ease-in-out infinite;
    }

    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      box-shadow: var(--shadow-primary);
      transition: all var(--transition-base);
    }

    .logo-img:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-primary-lg);
    }

    .welcome-text {
      margin-bottom: var(--space-8);
    }

    .welcome-text h2 {
      font-size: var(--text-3xl);
      font-weight: var(--font-extrabold);
      color: var(--gray-900);
      margin-bottom: var(--space-2);
      background: linear-gradient(135deg, var(--primary-600), var(--primary-500));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text p {
      font-size: var(--text-sm);
      color: var(--gray-600);
      margin-bottom: 0;
    }

    .form-group {
      text-align: left;
      margin-bottom: var(--space-5);
    }

    .submit-btn {
      margin-top: var(--space-4);
    }

    .footer-text {
      margin-top: var(--space-6);
      font-size: var(--text-xs);
      color: var(--gray-600);
    }

    .footer-text a {
      color: var(--primary-600);
      font-weight: var(--font-medium);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: var(--space-8) var(--space-6);
      }
      
      .logo-img {
        width: 100px;
        height: 100px;
      }

      .welcome-text h2 {
        font-size: var(--text-2xl);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card animate-scaleIn">
      <div class="logo-wrapper">
        <img src="assets/images/logoonex.png" alt="ONEX Consultant Logo" class="logo-img">
      </div>

      <div class="welcome-text">
        <h2>Welcome to ONEX Consultant</h2>
        <p>Your Gateway to Intelligent Interaction</p>
      </div>

      <form id="consultantForm">
        <div class="form-group">
          <label for="name" class="form-label required">Name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="Enter your full name" 
            required
            minlength="2"
            maxlength="100"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label required">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="name@company.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="service" class="form-label required">Service</label>
          <select id="service" class="form-select" required>
            <option value="" disabled selected>Select a service</option>
            <option value="cloud-consulting">Cloud Consulting</option>
            <option value="cyber-security">Cyber Security</option>
            <option value="erp-system">ERP System</option>
            <option value="digital-transformation">Digital Transformation</option>
            <option value="data-analytics">Data Analytics</option>
            <option value="software-development">Software Development</option>
            <option value="it-support">IT Support</option>
            <option value="devops-consulting">DevOps Consulting</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full submit-btn">
          Continue to Dashboard
        </button>
      </form>

      <div class="footer-text">
        By continuing, you agree to our <a href="#">Terms of Service</a>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/security-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
